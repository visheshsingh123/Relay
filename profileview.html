<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D0B14">
<title>Profile — Relay</title>
<link rel="icon" type="image/png" href="Assets/logo.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="Assets/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Relay">
<link rel="stylesheet" href="styles.css">
</head>
<body class="settings-body">

<div class="settings-page profileview-page">

  <header class="settings-topbar">
    <h1 class="logo"><a class="logo__link" href="index.html">Relay<span class="logo__dot">.</span></a></h1>
    <a class="icon-btn" id="backToApp" href="index.html" aria-label="Back to conversations">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </a>
  </header>

  <main class="settings-main profileview-main">
    <div class="settings-card profileview-card">

      <!-- Hero Profile Area -->
      <div class="profileview-hero">
        <div class="profileview-avatar-wrap" id="pvAvatarWrap" title="Click to view full photo">
          <span class="avatar profileview-avatar" id="pvAvatar"></span>
          <span class="profileview-avatar-badge" id="pvOnlineBadge" hidden></span>
        </div>

        <h2 class="profileview-name" id="pvName">Loading profile…</h2>
        <p class="profileview-username" id="pvUsername">@user</p>
        <div class="profileview-status" id="pvStatus"></div>
      </div>

      <!-- Bio / About Section -->
      <div class="profileview-section">
        <div class="profileview-section__label">About & Bio</div>
        <div class="profileview-bio" id="pvBio">No bio added yet.</div>
      </div>

      <!-- Quick Message CTA -->
      <div class="profileview-cta">
        <button type="button" class="btn-primary profileview-msg-btn" id="pvMessageBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Send Message
        </button>
      </div>

      <!-- Feature Actions Grid -->
      <div class="profileview-section">
        <div class="profileview-section__label">Conversation Features</div>
        <div class="profileview-actions-grid">
          
          <button type="button" class="profileview-action-btn" id="pvPinBtn">
            <span class="profileview-action-icon">📌</span>
            <span class="profileview-action-text" id="pvPinLabel">Pin Chat</span>
          </button>

          <button type="button" class="profileview-action-btn" id="pvMuteBtn">
            <span class="profileview-action-icon" id="pvMuteIcon">🔕</span>
            <span class="profileview-action-text" id="pvMuteLabel">Mute Chat</span>
          </button>

          <button type="button" class="profileview-action-btn" id="pvSearchBtn">
            <span class="profileview-action-icon">🔍</span>
            <span class="profileview-action-text">Search Chat</span>
          </button>

          <button type="button" class="profileview-action-btn" id="pvSummarizeBtn">
            <span class="profileview-action-icon">📝</span>
            <span class="profileview-action-text">AI Summary</span>
          </button>

          <button type="button" class="profileview-action-btn profileview-action-btn--danger" id="pvBlockBtn">
            <span class="profileview-action-icon">🚫</span>
            <span class="profileview-action-text" id="pvBlockLabel">Block User</span>
          </button>

          <button type="button" class="profileview-action-btn profileview-action-btn--danger" id="pvDeleteBtn">
            <span class="profileview-action-icon">🗑️</span>
            <span class="profileview-action-text">Delete Messages</span>
          </button>

        </div>
      </div>

      <!-- User Details / Metadata -->
      <div class="profileview-section">
        <div class="profileview-section__label">User Details</div>
        <div class="profileview-details-list">
          <div class="profileview-detail-row">
            <span class="profileview-detail-title">Username</span>
            <span class="profileview-detail-value" id="pvDetailUsername">@user</span>
          </div>
          <div class="profileview-detail-row" id="pvEmailRow" hidden>
            <span class="profileview-detail-title">Email</span>
            <span class="profileview-detail-value" id="pvDetailEmail">user@example.com</span>
          </div>
          <div class="profileview-detail-row">
            <span class="profileview-detail-title">Member since</span>
            <span class="profileview-detail-value" id="pvDetailJoined">—</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Photo Lightbox Modal -->
  <div class="modal-overlay pv-lightbox" id="pvLightbox" hidden>
    <div class="pv-lightbox__content">
      <button type="button" class="pv-lightbox__close" id="pvLightboxClose" aria-label="Close image">✕</button>
      <img id="pvLightboxImg" src="Assets/pfp.jpg" alt="Profile Photo">
    </div>
  </div>

  <!-- Mute Duration Modal -->
  <div class="modal-overlay" id="muteModal" hidden>
    <div class="modal mute-modal" role="dialog" aria-modal="true" aria-labelledby="muteModalTitle">
      <h2 class="modal__title" id="muteModalTitle">🔕 Mute Notifications</h2>
      <p class="modal__body" id="muteModalBody">Choose how long you want to mute notifications for this chat:</p>
      
      <div class="mute-options">
        <button type="button" class="mute-opt-btn" data-duration="28800000">8 Hours</button>
        <button type="button" class="mute-opt-btn" data-duration="604800000">1 Week</button>
        <button type="button" class="mute-opt-btn" data-duration="-1">Always (Until turned off)</button>
      </div>

      <div class="custom-popup__actions" style="margin-top:16px;">
        <button type="button" class="btn-secondary" id="muteModalCancel">Cancel</button>
      </div>
    </div>
  </div>

</div>

<script>
  (function() {
    try {
      var params = new URLSearchParams(window.location.search);
      var targetUid = params.get("uid");
      var targetUsername = params.get("username");
      if (!targetUid && !targetUsername) return;

      var cached = null;
      if (targetUid) {
        var raw = localStorage.getItem("relay_user_cache_" + targetUid);
        if (raw) cached = JSON.parse(raw);
      }
      if (!cached && targetUsername) {
        var raw = localStorage.getItem("relay_user_cache_" + targetUsername.toLowerCase());
        if (raw) cached = JSON.parse(raw);
      }
      if (!cached) {
        var last = localStorage.getItem("relay_last_viewed_user");
        if (last) {
          var lu = JSON.parse(last);
          if ((targetUid && lu.uid === targetUid) || (targetUsername && lu.username && lu.username.toLowerCase() === targetUsername.toLowerCase())) {
            cached = lu;
          }
        }
      }
      if (!cached) {
        var own = localStorage.getItem("relay_user_profile");
        if (own) {
          var ou = JSON.parse(own);
          if ((targetUid && ou.uid === targetUid) || (targetUsername && ou.username && ou.username.toLowerCase() === targetUsername.toLowerCase())) {
            cached = ou;
          }
        }
      }
      if (!cached) {
        var chatsRaw = localStorage.getItem("relay_chats_cache");
        if (chatsRaw) {
          var chatsList = JSON.parse(chatsRaw);
          if (Array.isArray(chatsList)) {
            for (var i = 0; i < chatsList.length; i++) {
              var c = chatsList[i];
              if (c.users && typeof c.users === "object") {
                for (var uKey in c.users) {
                  var u = c.users[uKey];
                  if (targetUid && (uKey === targetUid || u.uid === targetUid)) {
                    cached = Object.assign({ uid: uKey }, u);
                    break;
                  }
                  if (targetUsername && u.username && u.username.toLowerCase() === targetUsername.toLowerCase()) {
                    cached = Object.assign({ uid: uKey }, u);
                    break;
                  }
                }
                if (cached) break;
              }
            }
          }
        }
      }

      if (cached) {
        var nameEl = document.getElementById("pvName");
        var unameEl = document.getElementById("pvUsername");
        var detailUnameEl = document.getElementById("pvDetailUsername");
        var avatarEl = document.getElementById("pvAvatar");
        var bioEl = document.getElementById("pvBio");
        var emailEl = document.getElementById("pvDetailEmail");
        var emailRow = document.getElementById("pvEmailRow");
        var detailJoined = document.getElementById("pvDetailJoined");

        if (nameEl && cached.name) nameEl.textContent = cached.name;
        if (unameEl && cached.username) unameEl.textContent = "@" + cached.username;
        if (detailUnameEl && cached.username) detailUnameEl.textContent = "@" + cached.username;
        if (avatarEl && cached.photoURL) {
          avatarEl.style.backgroundImage = "url('" + cached.photoURL + "')";
          avatarEl.style.backgroundSize = "cover";
          avatarEl.style.backgroundPosition = "center";
          avatarEl.style.color = "transparent";
        }
        if (bioEl && cached.bio && cached.bio.trim()) {
          bioEl.textContent = cached.bio;
          bioEl.classList.remove("is-empty");
        }
        if (emailEl && cached.email) {
          emailEl.textContent = cached.email;
          if (emailRow) emailRow.hidden = false;
        }
        if (detailJoined && cached.createdAt) {
          var date = cached.createdAt.toDate ? cached.createdAt.toDate() : new Date(cached.createdAt);
          if (!isNaN(date.getTime())) {
            detailJoined.textContent = date.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
          }
        }
      }
    } catch (_) {}
  })();
</script>
<script type="module" src="profileview.js"></script>
<script src="pwa-register.js"></script>
</body>
</html>
